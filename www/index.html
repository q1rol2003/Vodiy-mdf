<script>
        function addStock(index) {
            var input = document.getElementById('add-qty-' + index);
            var addQty = Number(input.value);
            if (!addQty || addQty <= 0) return alert("To'g'ri miqdor kiriting!");

            doors[index].qty += addQty;
            persistAll();
            renderInv();
            renderPOS();
            renderOrderModels();
        }

        function reduceStock(index) {
            var input = document.getElementById('add-qty-' + index);
            var subQty = Number(input.value);
            if (!subQty || subQty <= 0) return alert("To'g'ri miqdor kiriting!");
            if (doors[index].qty < subQty) return alert("Ombordagi qoldiqdan ko'p miqdorni ayirib bo'lmaydi!");

            doors[index].qty -= subQty;
            persistAll();
            renderInv();
            renderPOS();
            renderOrderModels();
        }

        function editInventory(index) {
            var item = doors[index];
            var newName = prompt("Eshik nomi:", item.name);
            if (newName === null) return;
            var newSize = prompt("Razmeri:", item.size);
            if (newSize === null) return;
            var newPrice = prompt("Narxi (so'm):", item.price);
            if (newPrice === null) return;
            var newQty = prompt("Qoldiq (dona):", item.qty);
            if (newQty === null) return;

            doors[index].name = newName.trim() || item.name;
            doors[index].size = newSize.trim() || item.size;
            doors[index].price = Number(newPrice) || item.price;
            doors[index].qty = Number(newQty) >= 0 ? Number(newQty) : item.qty;

            persistAll();
            renderInv();
            renderPOS();
            renderOrderModels();
        }

        function deleteInventory(index) {
            if (!confirm("Ushbu eshik modelini ombordan o'chirmoqchimisiz?")) return;
            doors.splice(index, 1);
            persistAll();
            renderInv();
            renderPOS();
            renderOrderModels();
        }

        function addInventory() {
            var name = document.getElementById('inv-name').value.trim();
            var size = document.getElementById('inv-size').value.trim();
            var price = Number(document.getElementById('inv-price').value);
            var qty = Number(document.getElementById('inv-qty').value);

            if (!name || !size || isNaN(price) || isNaN(qty)) {
                return alert("Barcha maydonlarni to'g'ri to'ldiring!");
            }

            doors.push({
                id: Date.now(),
                name: name,
                size: size,
                price: price,
                qty: qty
            });

            persistAll();
            document.getElementById('inv-name').value = '';
            document.getElementById('inv-size').value = '';
            document.getElementById('inv-price').value = '';
            document.getElementById('inv-qty').value = '';

            renderInv();
            renderPOS();
            renderOrderModels();
        }

        function renderInv() {
            var container = document.getElementById('inv-table');
            if (doors.length === 0) {
                container.innerHTML = '<div class="inv-empty">Ombor bo\'sh</div>';
                return;
            }
            container.innerHTML = '';
            doors.forEach(function(d, idx) {
                var isLow = d.qty <= 2;
                container.innerHTML += 
                    '<div class="inv-card">' +
                        '<div class="inv-card-top">' +
                            '<div>' +
                                '<div class="inv-card-name">' + d.name + '</div>' +
                                '<div class="inv-card-meta">Razmer: ' + d.size + '</div>' +
                            '</div>' +
                            '<div class="inv-card-price">' + fmt(d.price) + ' so\'m</div>' +
                        '</div>' +
                        '<div class="inv-card-qty ' + (isLow ? 'low' : '') + '">Qoldiq: ' + d.qty + ' dona' + (isLow ? ' ⚠️' : '') + '</div>' +
                        '<div style="margin-top:10px; display:flex; gap:8px; align-items:center;">' +
                            '<input type="number" id="add-qty-' + idx + '" value="1" min="1" style="width:70px; padding:6px; border:1px solid #ccc; border-radius:6px;">' +
                            '<button onclick="addStock(' + idx + ')" class="inv-btn-add" style="padding:6px 12px; border:none; border-radius:6px; cursor:pointer;">➕ Qo\'shish</button>' +
                            '<button onclick="reduceStock(' + idx + ')" class="inv-btn-remove" style="padding:6px 12px; border:none; border-radius:6px; cursor:pointer;">➖ Ayirish</button>' +
                        '</div>' +
                        '<div class="inv-card-actions">' +
                            '<button onclick="editInventory(' + idx + ')" class="inv-btn-edit">✏️ Tahrirlash</button>' +
                            '<button onclick="deleteInventory(' + idx + ')" class="inv-btn-delete">🗑️ O\'chirish</button>' +
                        '</div>' +
                    '</div>';
            });
        }

        // ===== AKSESSUARLAR =====
        function addAccessory() {
            var name = document.getElementById('acc-name').value.trim();
            var qty = Number(document.getElementById('acc-qty').value);

            if (!name || isNaN(qty)) return alert("Barcha maydonlarni to'ldiring!");

            accessories.push({ id: Date.now(), name: name, qty: qty });
            persistAll();

            document.getElementById('acc-name').value = '';
            document.getElementById('acc-qty').value = '';
            renderAccessories();
        }

        function editAccessory(idx) {
            var acc = accessories[idx];
            var newName = prompt("Aksessuar nomi:", acc.name);
            if (newName === null) return;
            var newQty = prompt("Qoldiq (dona):", acc.qty);
            if (newQty === null) return;

            accessories[idx].name = newName.trim() || acc.name;
            accessories[idx].qty = Number(newQty) >= 0 ? Number(newQty) : acc.qty;

            persistAll();
            renderAccessories();
        }

        function deleteAccessory(idx) {
            if (!confirm("Ushbu aksessuarni o'chirmoqchimisiz?")) return;
            accessories.splice(idx, 1);
            persistAll();
            renderAccessories();
        }

        function renderAccessories() {
            var container = document.getElementById('acc-table');
            var select = document.getElementById('e-acc-select');
            
            if (select) {
                select.innerHTML = '<option value="">-- Aksessuar tanlang --</option>';
                accessories.forEach(function(a) {
                    select.innerHTML += '<option value="' + a.id + '">' + a.name + ' (Qoldiq: ' + a.qty + ' dona)</option>';
                });
            }

            if (accessories.length === 0) {
                container.innerHTML = '<div class="inv-empty">Aksessuarlar ro\'yxati bo\'sh</div>';
                return;
            }

            container.innerHTML = '';
            accessories.forEach(function(a, idx) {
                container.innerHTML += 
                    '<div class="inv-card">' +
                        '<div class="inv-card-top">' +
                            '<div class="inv-card-name">' + a.name + '</div>' +
                            '<div class="inv-card-qty">Qoldiq: ' + a.qty + ' dona</div>' +
                        '</div>' +
                        '<div class="inv-card-actions">' +
                            '<button onclick="editAccessory(' + idx + ')" class="inv-btn-edit">✏️ Tahrirlash</button>' +
                            '<button onclick="deleteAccessory(' + idx + ')" class="inv-btn-delete">🗑️ O\'chirish</button>' +
                        '</div>' +
                    '</div>';
            });
        }

        // ===== BUYURTMA BO'LIMI =====
        var currentOrderItems = [];
        var currentOrderAccessories = [];

        function renderOrderModels() {
            filterModelSearch();
        }

        function filterModelSearch() {
            var query = (document.getElementById('e-model-search').value || '').toLowerCase();
            var dropdown = document.getElementById('e-model-dropdown');
            if (!dropdown) return;

            var filtered = doors.filter(function(d) {
                return d.name.toLowerCase().includes(query) || d.size.toLowerCase().includes(query);
            });

            if (filtered.length === 0) {
                dropdown.innerHTML = '<div class="model-dropdown-empty">Model topilmadi</div>';
            } else {
                dropdown.innerHTML = '';
                filtered.forEach(function(d) {
                    var item = document.createElement('div');
                    item.className = 'model-dropdown-item' + (d.qty <= 0 ? ' disabled' : '');
                    item.onclick = function() { selectOrderModel(d); };
                    item.innerHTML = 
                        '<span class="mdi-price">' + fmt(d.price) + ' so\'m</span>' +
                        '<div class="mdi-name">' + d.name + '</div>' +
                        '<div class="mdi-meta">Razmer: ' + d.size + ' | Qoldiq: ' + d.qty + ' dona</div>';
                    dropdown.appendChild(item);
                });
            }
            dropdown.style.display = 'block';
        }

        document.addEventListener('click', function(e) {
            var wrap = document.querySelector('.model-search-wrap');
            var dropdown = document.getElementById('e-model-dropdown');
            if (wrap && !wrap.contains(e.target) && dropdown) {
                dropdown.style.display = 'none';
            }
        });

        function selectOrderModel(d) {
            document.getElementById('e-model-search').value = d.name + ' (' + d.size + ')';
            document.getElementById('e-model').value = d.id;
            document.getElementById('e-name').value = d.name;
            document.getElementById('e-size').value = d.size;
            document.getElementById('e-unit-price').value = d.price;
            document.getElementById('e-model-dropdown').style.display = 'none';
            checkStock();
        }

        function checkStock() {
            var modelId = document.getElementById('e-model').value;
            var qty = Number(document.getElementById('e-qty').value) || 1;
            var info = document.getElementById('e-stock-info');
            if (!modelId) { info.innerText = ''; return; }

            var d = doors.find(function(x) { return x.id === Number(modelId); });
            if (d) {
                if (qty > d.qty) {
                    info.style.color = '#ef4444';
                    info.innerText = '⚠️ Ogohlantirish: Omborda bor-yo\'g\'i ' + d.qty + ' dona bor!';
                } else {
                    info.style.color = '#10b981';
                    info.innerText = '✅ Omborda yetarli: ' + d.qty + ' dona bor';
                }
            }
        }

        function addOrderItem() {
            var name = document.getElementById('e-name').value.trim();
            var qty = Number(document.getElementById('e-qty').value);
            var size = document.getElementById('e-size').value.trim();
            var openType = document.getElementById('e-open').value.trim() || '-';
            var price = Number(document.getElementById('e-unit-price').value);
            var doorId = document.getElementById('e-model').value;

            if (!name || !qty || !price) return alert("Mahsulot nomi, soni va narxini kiriting!");

            currentOrderItems.push({
                doorId: doorId ? Number(doorId) : null,
                name: name,
                qty: qty,
                size: size,
                openType: openType,
                price: price,
                total: price * qty
            });

            // Tozalash
            document.getElementById('e-model-search').value = '';
            document.getElementById('e-model').value = '';
            document.getElementById('e-name').value = '';
            document.getElementById('e-qty').value = '1';
            document.getElementById('e-size').value = '';
            document.getElementById('e-open').value = '';
            document.getElementById('e-unit-price').value = '';
            document.getElementById('e-stock-info').innerText = '';

            renderOrderItems();
            calc();
        }

        function removeOrderItem(idx) {
            currentOrderItems.splice(idx, 1);
            renderOrderItems();
            calc();
        }

        function renderOrderItems() {
            var container = document.getElementById('order-items-list');
            if (currentOrderItems.length === 0) {
                container.innerHTML = '<p style="color:#999; font-size:13px;">Hali mahsulot qo\'shilmagan</p>';
                return;
            }
            container.innerHTML = '';
            currentOrderItems.forEach(function(item, idx) {
                container.innerHTML += 
                    '<div class="order-item-card">' +
                        '<div class="oi-num">' + (idx + 1) + '</div>' +
                        '<div class="oi-info">' +
                            '<div class="oi-name">' + item.name + ' (' + item.qty + ' dona)</div>' +
                            '<div class="oi-meta">Razmer: ' + item.size + ' | Ochilishi: ' + item.openType + '</div>' +
                        '</div>' +
                        '<div class="oi-price">' + fmt(item.total) + ' so\'m</div>' +
                        '<button class="oi-remove" onclick="removeOrderItem(' + idx + ')">✕</button>' +
                    '</div>';
            });
        }

        function addOrderAccessory() {
            var sel = document.getElementById('e-acc-select');
            var qty = Number(document.getElementById('e-acc-qty').value);
            if (!sel.value || !qty) return alert("Aksessuar va sonini tanlang!");

            var acc = accessories.find(function(x) { return x.id === Number(sel.value); });
            if (!acc) return;

            currentOrderAccessories.push({
                accId: acc.id,
                name: acc.name,
                qty: qty
            });

            document.getElementById('e-acc-select').value = '';
            document.getElementById('e-acc-qty').value = '1';

            renderOrderAccessories();
        }

        function removeOrderAccessory(idx) {
            currentOrderAccessories.splice(idx, 1);
            renderOrderAccessories();
        }

        function renderOrderAccessories() {
            var container = document.getElementById('order-acc-list');
            if (currentOrderAccessories.length === 0) {
                container.innerHTML = '<p style="color:#999; font-size:13px;">Hali aksessuar qo\'shilmagan</p>';
                return;
            }
            container.innerHTML = '';
            currentOrderAccessories.forEach(function(item, idx) {
                container.innerHTML += 
                    '<div class="order-item-card" style="border-left-color: #3b82f6;">' +
                        '<div class="oi-num" style="background: #3b82f6;">' + (idx + 1) + '</div>' +
                        '<div class="oi-info">' +
                            '<div class="oi-name">' + item.name + '</div>' +
                            '<div class="oi-meta">Soni: ' + item.qty + ' dona</div>' +
                        '</div>' +
                        '<button class="oi-remove" onclick="removeOrderAccessory(' + idx + ')">✕</button>' +
                    '</div>';
            });
        }

        function calc() {
            var itemsTotal = currentOrderItems.reduce(function(sum, item) { return sum + item.total; }, 0);
            document.getElementById('p-price').value = itemsTotal;

            var discount = Number(document.getElementById('p-discount').value) || 0;
            var afterDiscount = itemsTotal - discount;
            if (afterDiscount < 0) afterDiscount = 0;

            document.getElementById('p-after-discount').innerText = 'Chegirmadan keyin: ' + fmt(afterDiscount) + ' so\'m';

            var avans = Number(document.getElementById('p-avans').value) || 0;
            var debt = afterDiscount - avans;
            document.getElementById('p-debt').value = debt > 0 ? debt : 0;

            calcSplit();
        }

        function togglePaySplit() {
            var type = document.getElementById('p-paytype').value;
            var splitFields = document.getElementById('p-split-fields');
            var splitInfo = document.getElementById('p-split-info');

            if (type === 'aralash') {
                splitFields.style.display = 'grid';
                splitInfo.style.display = 'block';
                calcSplit();
            } else {
                splitFields.style.display = 'none';
                splitInfo.style.display = 'none';
            }
        }

        function calcSplit() {
            var type = document.getElementById('p-paytype').value;
            if (type !== 'aralash') return;

            var avans = Number(document.getElementById('p-avans').value) || 0;
            var naqd = Number(document.getElementById('p-split-naqd').value) || 0;
            var terminal = Number(document.getElementById('p-split-terminal').value) || 0;
            var totalEntered = naqd + terminal;

            var info = document.getElementById('p-split-info');
            if (totalEntered !== avans) {
                info.style.color = '#ef4444';
                info.innerText = '⚠️ Kiritilgan yig\'indi (' + fmt(totalEntered) + ') Avansga (' + fmt(avans) + ') teng bo\'lishi kerak!';
            } else {
                info.style.color = '#10b981';
                info.innerText = '✅ To\'lov taqsimoti to\'g\'ri';
            }
        }

        function saveFullOrder() {
            var client = document.getElementById('m-name').value.trim();
            var phone = document.getElementById('m-phone').value.trim() || '-';
            var address = document.getElementById('m-address').value.trim() || '-';

            if (!client) return alert("Mijoz ismini kiriting!");
            if (currentOrderItems.length === 0) return alert("Kamida bitta mahsulot qo'shing!");

            var price = Number(document.getElementById('p-price').value);
            var discount = Number(document.getElementById('p-discount').value) || 0;
            var avans = Number(document.getElementById('p-avans').value) || 0;
            var debt = Number(document.getElementById('p-debt').value) || 0;
            var deadline = document.getElementById('p-deadline').value;
            var payType = document.getElementById('p-paytype').value;
            var note = document.getElementById('p-note').value.trim() || '-';

            var naqdPart = 0, terminalPart = 0;
            if (payType === 'naqd') naqdPart = avans;
            else if (payType === 'terminal') terminalPart = avans;
            else if (payType === 'aralash') {
                naqdPart = Number(document.getElementById('p-split-naqd').value) || 0;
                terminalPart = Number(document.getElementById('p-split-terminal').value) || 0;
                if (naqdPart + terminalPart !== avans) {
                    return alert("Aralash to'lov yig'indisi avans summasiga teng bo'lishi kerak!");
                }
            }

            // Ombordan ayirish
            currentOrderItems.forEach(function(item) {
                if (item.doorId) {
                    var d = doors.find(function(x) { return x.id === item.doorId; });
                    if (d) d.qty = Math.max(0, d.qty - item.qty);
                }
            });

            currentOrderAccessories.forEach(function(item) {

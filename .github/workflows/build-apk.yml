name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (Capacitor generates the project)
        run: npx cap add android

      - name: Generate app icons
        run: npx @capacitor/assets generate --android
     
      - name: Copy custom native files into generated project
        run: |
          PKG_DIR="android/app/src/main/java/com/vodiymdf/app"
          mkdir -p "$PKG_DIR"
          cp native-patch/MainActivity.java "$PKG_DIR/MainActivity.java"
          cp native-patch/MicRecorderPlugin.java "$PKG_DIR/MicRecorderPlugin.java"
          cp native-patch/MicRecordingService.java "$PKG_DIR/MicRecordingService.java"

      - name: Patch AndroidManifest.xml (permissions + service)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" << 'EOF'
          import sys
          path = sys.argv[1]
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          with open('native-patch/manifest-permissions.txt', 'r', encoding='utf-8') as f:
              perms = f.read()
          with open('native-patch/manifest-service.txt', 'r', encoding='utf-8') as f:
              service = f.read()

          if '</manifest>' in content:
              content = content.replace('</manifest>', perms + '</manifest>')
          if '</application>' in content:
              content = content.replace('</application>', service + '    </application>')

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          EOF
          cat "$MANIFEST"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vodiy-mdf-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
